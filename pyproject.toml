[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-codebase"
version = "0.1.0"
description = "Adaptive Navigation Teams for codebase question answering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "openai>=1.99.0",
  "pydantic>=2.8",
  "tiktoken>=0.7",
  "typer>=0.12",
]

[project.optional-dependencies]
bench = [
  "datasets>=3.0",
]
# GAIA substrate extra. Kept OUT of the core dependency set on purpose:
# adding a ~20 MiB native wheel to what every other benchmark's CI
# installs would be a cost paid by substrates that never read a PDF.
#
# PyMuPDF is the ONLY third-party reader the GAIA substrate needs --
# .xlsx, .csv, .docx and .pptx are all read with the stdlib (zipfile +
# xml.etree), see `evaluation_suite/gaia_scope.py`. PDF is the one
# format with no honest stdlib path.
#
# Lower bound 1.24: `import pymupdf` (rather than the legacy `fitz`
# alias, which now warns) is only available from 1.24 onwards. Upper
# bound <2: PyMuPDF has broken API across majors before.
gaia = [
  "pymupdf>=1.24,<2",
]
dense = [
  "fastembed>=0.7",
]
# RepoDistill baseline only (ant.external_wrappers.repodistill*). A separate
# extra, not added to `dense`, because these are heavy and nothing else in
# this project needs them: tree-sitter drives the paper's dependency-graph
# construction, and transformers/torch run Qwen2.5-Coder-0.5B locally for
# CABA's perplexity/similarity scoring. Both are imported lazily (inside the
# functions that use them), so importing the RepoDistill modules -- and the
# whole default test suite -- still works without this extra installed.
repodistill = [
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "transformers>=4.40",
  "torch>=2.2",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
ant = "ant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `third_party` holds artifacts VENDORED BYTE-FOR-BYTE from each
# benchmark's own official repository (RepoProbe's prompt templates,
# GAIA's scorer.py). They are deliberately not ours to reformat: linting
# them reports 17 findings that must never be "fixed", and an actual
# `ruff --fix` over them would silently break fidelity -- GAIA's scorer
# is SHA-256-pinned at import (see ant.evaluation_suite.gaia_scorer), so
# a reformat there fails every GAIA run outright. Excluded rather than
# per-file-ignored because the rule is categorical: nothing under
# `third_party` is authored here. (`[tool.pyright]` already scopes itself
# to src/tests for the same reason.)
exclude = ["repos", "output", ".ant", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# JUDGE_PROMPT is a user-locked, verbatim prompt string (see the comment
# above it in judge.py) -- it must not be reformatted to satisfy line
# length, so this file is exempted from E501 rather than touching the text.
"src/ant/evaluation/judge.py" = ["E501"]
# SELECTOR_SYSTEM_PROMPT/SUFF_SYSTEM_PROMPT are verbatim copies of upstream
# S2G-RAG's own prompt strings (utils/prompt_template.py) -- reformatting
# them to satisfy line length would break the fidelity claim this baseline
# rests on, so this file is exempted rather than the text being touched.
"src/ant/external_wrappers/s2g_rag.py" = ["E501"]
# Every prompt in chainrag.py is reproduced VERBATIM (including original
# line breaks/indentation) from the pinned upstream ChainRAG commit -- see
# docs/chainrag_fidelity_audit.md. Reflowing them to satisfy line length
# would mean editing the fidelity-critical prompt text itself.
"src/ant/external_wrappers/chainrag.py" = ["E501"]
# CONTEXT_COMPRESSION_PROMPT/ANSWER_GENERATION_PROMPT in repodistill.py are
# reproduced VERBATIM from Table 4 (Appendix A.1.2) of the RepoDistill paper
# -- same rationale as the two entries above. Reflowing them to satisfy line
# length would mean editing the fidelity-critical prompt text itself.
"src/ant/external_wrappers/repodistill.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["repos", "output", ".ant"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
