[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-codebase"
version = "0.1.0"
description = "Adaptive Navigation Teams for codebase question answering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.99.0",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
bench = [
  "datasets>=3.0",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "pyright>=1.1",
]

[project.scripts]
ant = "ant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["repos", "output", ".ant"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# JUDGE_PROMPT is a user-locked, verbatim prompt string (see the comment
# above it in judge.py) -- it must not be reformatted to satisfy line
# length, so this file is exempted from E501 rather than touching the text.
"src/ant/evaluation/judge.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["repos", "output", ".ant"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
